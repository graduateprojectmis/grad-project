<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirPods 智慧問答系統</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎧 AirPods 智慧助手</h1>
            <p>有任何關於 AirPods 的問題嗎？我來幫您解答！</p>
        </div>
        
        <div class="status-bar" id="statusBar">
            <span class="status-indicator" id="statusIndicator">⚪</span>
            <span id="statusText">連接中...</span>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="message bot">
                <div class="message-content">
                    您好！我是 AirPods 智慧助手。請問有什麼可以幫助您的嗎？
                </div>
            </div>
        </div>
        
        <div class="examples">
            <h3>💡 試試這些問題：</h3>
            <button class="example-button" onclick="askExample('怎麼配對 AirPods？')">
                怎麼配對 AirPods？
            </button>
            <button class="example-button" onclick="askExample('如何重置 AirPods？')">
                如何重置 AirPods？
            </button>
            <button class="example-button" onclick="askExample('怎麼確認 AirPods 的電量？')">
                怎麼確認電量？
            </button>
            <button class="example-button" onclick="askExample('AirPods 的降噪功能怎麼用？')">
                降噪功能
            </button>
        </div>
        
        <div class="input-container">
            <input 
                type="text" 
                id="questionInput" 
                placeholder="輸入您的問題..." 
                onkeypress="handleKeyPress(event)"
            >
            <label for="imageInput" class="upload-button" title="上傳圖片">
                📎
            </label>
            <input 
                type="file" 
                id="imageInput" 
                accept="image/*" 
                style="display: none;"
                onchange="handleImageSelect(event)"
            >
            <button id="askButton" onclick="askQuestion()">
                <span id="buttonText">發送</span>
            </button>
        </div>
        
        <!-- 圖片預覽區域 -->
        <div id="imagePreview" class="image-preview" style="display: none;">
            <div class="preview-header">
                <span>已選擇圖片：</span>
                <button onclick="clearImage()" class="clear-button">✕</button>
            </div>
            <img id="previewImage" alt="預覽">
            <div class="image-info">
                <span id="imageName"></span>
                <span id="imageSize"></span>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

# pytest 配置檔案

[tool:pytest]
# 測試目錄
testpaths = tests

# Python 檔案模式
python_files = test_*.py

# Python 類別模式
python_classes = Test*

# Python 函數模式
python_functions = test_*

# 命令列選項
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# 標記定義
markers =
    unit: 單元測試
    integration: 整合測試
    slow: 執行較慢的測試
    api: API 測試
    service: 服務層測試
    
# 覆蓋率設定
[coverage:run]
source = app
omit = 
    */tests/*
    */conftest.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
